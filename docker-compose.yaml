services:
  redis:
    image: redis:7-alpine
    container_name: redis-crawler
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync always
      --save 60 1
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --protected-mode no

volumes:
  redis_data: